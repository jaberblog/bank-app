name: Build Flutter Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android Platform Files & Keep Custom Code
        run: |
          cp lib/main.dart /tmp/main.dart.bak
          cp pubspec.yaml /tmp/pubspec.yaml.bak
          flutter create --platforms=android --org com.example.banking --project-name banking_dashboard .
          cp /tmp/main.dart.bak lib/main.dart
          cp /tmp/pubspec.yaml.bak pubspec.yaml
          # Ensure INTERNET permission is present for release APK avatars
          if ! grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: banking-dashboard-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
